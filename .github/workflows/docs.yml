name: docs

on:
  pull_request:
    paths: &paths
      - "requirements/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "mise.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths: *paths

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate
      - run: pnpm generate
      - name: 生成物（CSV・README）が最新であることを確認
        run: git diff --exit-code
