name: docs

on:
  pull_request:
    paths: &paths
      - "requirements/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "mise.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths: *paths

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate
      - run: pnpm generate
      - name: 生成物（CSV・README・draw.io）が最新であることを確認
        run: git diff --exit-code

  svg:
    needs: validate
    runs-on: ubuntu-latest
    env:
      DRAWIO_VERSION: "32.4.1"
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - name: draw.io をインストール
        run: |
          curl -fsSL -o "$RUNNER_TEMP/drawio.deb" \
            "https://github.com/jgraph/drawio-desktop/releases/download/v${DRAWIO_VERSION}/drawio-amd64-${DRAWIO_VERSION}.deb"
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP/drawio.deb" xvfb
      - run: xvfb-run -a pnpm generate:svg
      - uses: actions/upload-artifact@v6
        with:
          name: communication-svg
          path: docs/diagrams/communication.svg
      # SVG は OS・フォント環境で出力が変わる可能性があるため、差分は警告に留める
      - name: SVG の差分を確認
        run: |
          if ! git diff --quiet -- docs/diagrams/communication.svg; then
            echo "::warning file=docs/diagrams/communication.svg::CI で生成した SVG がコミット済みのものと異なります。Artifact の SVG を確認してください"
          fi
